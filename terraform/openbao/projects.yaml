# Every project's OpenBao side: per environment, the policy dokploy-project-<project>-<env> and the empty
# secret path secret/<project>/<env>, to fill in the OpenBao UI. Under secret/<project>/<env>/database/,
# kthaisociety/deployments' CI writes the credentials of the databases it creates; people can only read
# those. Everything else about a project (its
# Dokploy side, secret names, images) is in kthaisociety/deployments, whose checks fail until the
# project is listed here.
#
# Policies live here, not in deployments: a policy's contents decide what a token minted with it can
# read, and deployments' CI may mint tokens with them.
#
# Adding a project is one line:   my-app: {}
# Defaults: environments [staging, production]. Optional keys:
#   environments: [...]   # environment names: lowercase letters and digits only
#   storage: {}           # object storage: per environment, its own GleSYS instance and the bucket
#                         # kthais-<project>-<env>, credentials at secret/<project>/<env>/storage
#                         # (terraform/glesys/storage.tf). Can't be removed by deleting the line.
#   storage:              # several buckets instead: kthais-<project>-<env>-uploads, ...-user-files.
#     buckets: [uploads, user-files]   # lowercase letters, digits, single hyphens. More can be added
#                                      # later; removing one is like removing storage.
#
# Every project reads the shared store of its environment, secret/shared/<env>; nothing to add here for it.

onboarding-service: {}

lucid: {}

landingpage-backend: {}

landingpage-frontend: {}
