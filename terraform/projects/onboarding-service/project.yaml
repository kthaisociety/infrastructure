# Read by terraform/openbao (policy, provider token, secret paths) and terraform/dokploy (the Dokploy
# project, its vault provider and the app, built by modules/project). Migration: docs/onboarding-service-migration.md.
name: onboarding-service
repo: kthaisociety/onboarding-service
type: app
environments:
  production:
    # False: changes are saved in Dokploy but not deployed. The first deploy is by hand, once the
    # volume holds the old database (migration doc). Set true after that.
    deploy: false
    branch: main
    # Named Docker volumes, by mount path. The volume is <project>-<environment>-<name>.
    volumes:
      /data: data
    # Not secret: written as-is.
    env:
      BACKEND_URL: http://kthaisbackend-backend-hzwlri:8080/api/v1
      PORTAL_BASE_URL: https://kthais.com/onboarding
      MATTERMOST_URL: https://chat.aisociety.se
      GOOGLE_ADMIN_IMPERSONATE_AS: onboarding-automation@kthais.com
      GIN_MODE: release
    # Names only. Values are in OpenBao at secret/onboarding-service/production.
    secrets:
      - MATTERMOST_BOT_TOKEN
      - GOOGLE_ADMIN_SERVICE_ACCOUNT_JSON
    # Shared secrets, by name: the keys at secret/shared/<name>/production. Also read by
    # landingpage-backend once it moves.
    shared:
      onboarding-service-secret: [ONBOARDING_SERVICE_SECRET]
