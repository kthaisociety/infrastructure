# The OpenBao side of onboarding-service, read by terraform/openbao: per environment, the policy
# dokploy-project-onboarding-service-<env> and the empty path secret/onboarding-service/<env>. Its
# Dokploy side, and the image it runs, are in kthaisociety/deployments (projects/onboarding-service).
name: onboarding-service
repo: kthaisociety/onboarding-service
environments:
  # Inert secrets: a service account JSON with no real key, a dummy Mattermost token, its own shared
  # secret. It starts and resolves every reference, and can't touch a real account.
  staging:
    shared: [onboarding-service-secret]
  production:
    # secret/shared/onboarding-service-secret/<env>: ONBOARDING_SERVICE_SECRET, also read by
    # landingpage-backend.
    shared: [onboarding-service-secret]
