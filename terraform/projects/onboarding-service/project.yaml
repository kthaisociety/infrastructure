# Read by terraform/openbao now (its policy, provider token and secret path), and by terraform/dokploy
# once modules/app exists (the new Dokploy project, its vault provider and the app).
name: onboarding-service
repo: kthaisociety/onboarding-service
environments:
  production:
    # Names only. Values are written in the OpenBao UI at secret/onboarding-service/production.
    secrets:
      - MATTERMOST_BOT_TOKEN
      - GOOGLE_ADMIN_SERVICE_ACCOUNT_JSON
    # secret/shared/onboarding-service-secret/production: ONBOARDING_SERVICE_SECRET, also read by
    # landingpage-backend.
    shared: [onboarding-service-secret]
