name: tofu

# One workflow for every root module, so applies run in dependency order:
# glesys → openbao → dokploy. Only glesys exists so far.

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/tofu.yml"

permissions:
  contents: read

concurrency:
  # One run at a time across the repo: state locking isn't enabled yet (see terraform/glesys/versions.tf).
  group: tofu
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.12.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Backend: the tfstate instance's CI credential.
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - run: tofu fmt -check -recursive terraform

  glesys-plan:
    if: github.event_name == 'pull_request'
    needs: fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/glesys
    env:
      GLESYS_USERID: ${{ secrets.GLESYS_USERID }}
      GLESYS_TOKEN: ${{ secrets.GLESYS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init
      - run: tofu validate
      - name: tofu plan
        run: |
          tofu plan -lock=false -no-color | tee plan.txt
          {
            echo '### terraform/glesys plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  glesys-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fmt
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/glesys
    env:
      GLESYS_USERID: ${{ secrets.GLESYS_USERID }}
      GLESYS_TOKEN: ${{ secrets.GLESYS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve
