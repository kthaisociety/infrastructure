name: tofu

# One workflow for every root module, so applies run in dependency order:
# glesys → openbao → dokploy (docs/plan.md, "Bootstrap order", for how the very first build differed).

on:
  # Every PR, not only those touching terraform/: fmt and openbao-validate are required checks, and a
  # required check that never starts blocks the PR. The plan jobs still run only when terraform/
  # changed (the `changes` job).
  pull_request:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/tofu.yml"
  # Renews OpenBao's periodic tokens (Dokploy providers, snapshots) even when nothing changes. Unrenewed,
  # they expire 32 days after the last apply.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Applies (main, schedule, dispatch): one at a time across the repo, since state locking isn't enabled
  # (see terraform/glesys/versions.tf). PRs: one group per PR, so they never queue behind an apply or
  # cancel each other's required checks (a group holds one pending run, and a newer one cancels it).
  # PR plans only read state (-lock=false). A new push to a PR cancels that PR's older run.
  group: ${{ github.event_name == 'pull_request' && format('tofu-pr-{0}', github.event.pull_request.number) || 'tofu' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # An explicit `shell: bash` runs with -o pipefail, so `tofu plan | tee` fails when tofu fails.
    # The implicit default shell doesn't.
    shell: bash

# Secrets live in the `plan` and `production` environments, never at repo level, so a branch can't
# read them without a reviewer's approval (plan) or being main (production). They're set per job, only
# where tofu needs them. Actions are pinned to commit SHAs because steps in the plan and apply jobs can
# read those secrets.
env:
  TOFU_VERSION: 1.12.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - run: tofu fmt -check -recursive terraform

  # On PRs: did terraform/ or this workflow change? If not, the plan jobs are skipped, instead of
  # waiting for a reviewer to approve the `plan` environment for nothing.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      terraform: ${{ steps.files.outputs.terraform }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Its own command, so a failed request fails this job (bash -e) instead of reading as "no
          # terraform changes". previous_filename: a file moved out of terraform/ changes it too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          echo "$files"
          if grep -qE '^(terraform/|\.github/workflows/tofu\.yml$)' <<<"$files"; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  glesys-plan:
    if: github.event_name == 'pull_request' && needs.changes.outputs.terraform == 'true'
    needs: [fmt, changes]
    runs-on: ubuntu-latest
    # Holds the same secrets as production. Its required reviewers gate them: approving a run executes
    # the branch's workflow and Terraform code with those secrets, so review the whole diff first.
    environment: plan
    defaults:
      run:
        working-directory: terraform/glesys
    env:
      # Backend: the tfstate instance's CI credential.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      GLESYS_USERID: ${{ secrets.GLESYS_USERID }}
      GLESYS_TOKEN: ${{ secrets.GLESYS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init
      - run: tofu validate
      - name: tofu plan
        run: |
          tofu plan -lock=false -no-color | tee plan.txt
          {
            echo '### terraform/glesys plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  glesys-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fmt
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/glesys
    env:
      # Backend: the tfstate instance's CI credential.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      GLESYS_USERID: ${{ secrets.GLESYS_USERID }}
      GLESYS_TOKEN: ${{ secrets.GLESYS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve

  dokploy-plan:
    if: github.event_name == 'pull_request' && needs.changes.outputs.terraform == 'true'
    needs: [fmt, changes]
    runs-on: ubuntu-latest
    # See glesys-plan.
    environment: plan
    defaults:
      run:
        working-directory: terraform/dokploy
    env:
      # Backend: the tfstate instance's CI credential.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init
      - run: tofu validate
      - name: tofu plan
        run: |
          tofu plan -lock=false -no-color | tee plan.txt
          {
            echo '### terraform/dokploy plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dokploy-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: openbao-apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/dokploy
    env:
      # Backend: the tfstate instance's CI credential.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve

  openbao-validate:
    # No plan on PRs: CI's OpenBao login is bound to `production`, which only runs on main, and even a
    # read-only login would read every secret while refreshing state. The apply prints its plan first.
    if: github.event_name == 'pull_request'
    needs: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # a GitHub OIDC token for the subject check below; it never reaches OpenBao
    defaults:
      run:
        working-directory: terraform/openbao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init -backend=false
      - run: tofu validate
      # modules/project-secrets checks these too, but only at plan time, which is the apply on main.
      - name: project and environment names
        working-directory: terraform/projects
        run: |
          ok=true
          for f in */project.yaml; do
            p=${f%/project.yaml}
            echo "$p" | grep -qxE '[a-z0-9]+(-[a-z0-9]+)*' || { echo "::error file=terraform/projects/$f::project name: lowercase letters, digits, single hyphens"; ok=false; }
            for e in $(yq -r '.environments | keys | .[]' "$f"); do
              echo "$e" | grep -qxE '[a-z0-9]+' || { echo "::error file=terraform/projects/$f::environment '$e': lowercase letters and digits only, no hyphens"; ok=false; }
            done
          done
          $ok
      # CI's OpenBao login (openbao-apply) is only ever tried on main, so check here that the repo part of
      # the role's bound `sub` still matches what GitHub puts in this repo's tokens: the subject format
      # (immutable or name-only) or the repo's name can change outside this repo. The token is asked
      # for with another audience, so OpenBao would refuse it anyway, and only its `sub` is printed.
      - name: CI login subject matches GitHub's
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice::No OIDC token on this run (a fork's PR); subject check skipped."
            exit 0
          fi
          JWT=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kthais-subject-check" | jq -r .value)
          echo "::add-mask::$JWT"
          payload=$(cut -d. -f2 <<<"$JWT" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          sub=$(base64 -d <<<"$payload" | jq -r .sub)
          bound=$(sed -nE 's/^ *bound_claims *= *\{ *sub *= *"([^"]+)".*/\1/p' main.tf)
          # repo:<owner>/<repo>, with or without @<id>s; the rest is the environment or event.
          have=$(cut -d: -f1-2 <<<"$sub")
          want=$(cut -d: -f1-2 <<<"$bound")
          echo "GitHub's token: $sub"
          echo "Role binds:     $bound"
          if [ -z "$want" ] || [ "$have" != "$want" ]; then
            echo "::error file=terraform/openbao/main.tf::infrastructure-ci binds '$want', but GitHub's tokens say '$have'. openbao-apply would fail to log in."
            exit 1
          fi

  openbao-apply:
    # On a push to main after glesys-apply, and alone on the weekly schedule or a manual run (glesys-apply
    # is skipped then, which doesn't block this one; a failed one does).
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    needs: glesys-apply
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token CI logs in to OpenBao with
    defaults:
      run:
        working-directory: terraform/openbao
    env:
      # Backend, and terraform/glesys's state: the tfstate instance's CI credential.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_VAR_openbao_oidc_client_id: ${{ secrets.OPENBAO_OIDC_CLIENT_ID }}
      TF_VAR_openbao_oidc_client_secret: ${{ secrets.OPENBAO_OIDC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: GitHub OIDC token for OpenBao
        run: |
          JWT=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://bao.kthais.com" | jq -r .value)
          echo "::add-mask::$JWT"
          echo "TF_VAR_openbao_jwt=$JWT" >> "$GITHUB_ENV"
      - run: tofu init
      - run: tofu apply -auto-approve
