name: terraform-gcp

on:
  pull_request:
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/terraform-gcp.yml"
  push:
    branches: [main]
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/terraform-gcp.yml"

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for workload identity federation

concurrency:
  group: terraform-gcp
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform/gcp

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - run: tofu fmt -check -recursive
      - run: tofu init -input=false
      - run: tofu validate
      - name: tofu plan
        run: |
          tofu plan -input=false -lock=false -no-color | tee plan.txt
          {
            echo '### terraform/gcp plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The apply service account trusts only jobs running in this environment.
    # Restrict it to the main branch (and optionally require reviewers) in repo settings.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve
